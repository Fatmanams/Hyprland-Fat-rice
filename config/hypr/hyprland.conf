# =============================================================================
# hyprland.conf  —  generated rice.
#
# Before first login, REPLACE the TODOs below marked `@@ TODO @@` so they
# reflect your actual hardware. Most importantly:
#
#   $ hyprctl monitors              ## note the name, mode, refresh rate
#   edit this file, swap in the monitor= line, save.
#
# Color palette is provided by pywal16 at session start; that writes
# $HOME/.cache/wal/colors.sh. The "exec-once = wal ..." line below runs it.
# Tools (waybar, swaync, rofi) read source = common.<theme>.rasi/.css
# templates that import pywal vars. Editing colors here will not take
# effect across all components — re-run `wal -i <wallpaper>` and restart
# the affected tool to re-pick the palette.
#
# Mod key = SUPER (Windows key). Minecraft players: SUPER is normally
# unused by the game; Minecraft uses SHIFT for sprint, so this is fine.
# If you rebind sprint to ALT in-game, and want Hyprland on ALT instead,
# change $mod below.
# =============================================================================

# ---- Monitor (@@ TODO @@) ---------------------------------------------------
# AUTO-DETECT IS A STOPGAP, NOT THE COMMITTED CONFIG.
# After first login, run `hyprctl monitors` and replace the line below
# with an explicit one. Examples for single-monitor AMD/Intel setups:
#     monitor=eDP-1, 1920x1080@60, 0x0, 1
#     monitor=DP-1, 2560x1440@144, 0x0, 1
monitor=,preferred,auto,1

# ---- Variables --------------------------------------------------------------
$mod = SUPER
$terminal = ghostty
$menu = rofi -show drun -show-icons
$browser = helium-browser                     # Helium (AUR helium-browser-bin); SUPER+B opens it
$player = vlc                                 # VLC; default for video/audio MIME types
$files = yazi                                  # TUI file manager (SUPER+SHIFT+E)
$gui_files = thunar                          # GUI file manager (SUPER+SHIFT+F)
$editor = zed --wait
$lock = hyprlock
$bar_reload = killall waybar; waybar &

# Environment variables that downstream apps inherit. $EDITOR is used by
# git commit messages, sudoedit, visudo, crontab -e, etc. We set it to
# `zed --wait` so terminal tools that block on $EDITOR work correctly:
# zed opens the file in a GUI window, blocks until you close the tab,
# then returns control to the calling tool.
#
# CAVEAT for `sudoedit` / `visudo`: those run as root, and Zed (a Wayland
# GUI app) launched from a root context can fail to connect to your user's
# wayland socket. For those specific cases use the explicit form:
#   sudoedit -f -e nano /path/to/file       (or just: sudo nano /path/to/file)
# `nano` is installed by 00-base.sh specifically as this fallback — edit
# /etc/environment or your shell rc to override default $EDITOR if you
# want `nano` instead of `zed --wait` for these cases.
env = EDITOR, zed --wait
env = VISUAL, zed --wait

# ---- Programs autostarted ONCE at session start ----------------------------
exec-once = dbus-update-activation-environment --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal-hyprland &

# Compositor surface / portal fallback (per gotcha note):
# xdg-desktop-portal-hyprland is screen-capture only. GTK apps that
# invoke a file picker without a GTK portal fall back to nothing and hang.
# xdg-desktop-portal-gtk is installed; this env var makes GTK requests
# resolve to it. Don't remove this unless you also remove the gtk portal.
exec-once = systemctl --user start xdg-desktop-portal-gtk.service
exec-once = systemctl --user start xdg-desktop-portal-hyprland.service

# Bar / notifications / wallpaper / palette
exec-once = waybar
exec-once = swaync
# Bluetooth tray applet (blueman, from 00-base.sh) — drops into waybar's
# existing "tray" module; installing blueman alone doesn't start it.
exec-once = blueman-applet
# Animated wallpaper: mpvpaper (AUR, see 10-aur.sh). The video path is a
# TODO — drop a looping video at ~/.config/hypr/wallpaper.mp4 (not vendored
# in this repo). @@ TODO @@: replace eDP-1 with your monitor name from
# `hyprctl monitors`, same as hyprpaper.conf. --panscan=1 fills the screen
# without letterboxing; --no-audio because a wallpaper shouldn't play sound.
exec-once = mpvpaper -o "--loop --no-audio --panscan=1" eDP-1 $HOME/.config/hypr/wallpaper.mp4 || true
# Static fallback: if you don't want an animated wallpaper, comment the
# mpvpaper line above and uncomment this one (hyprpaper.conf still ships):
# exec-once = hyprpaper
exec-once = wl-paste --watch cliphist store &

# Palette: wallpaper mode (pywal16) when wallpaper.jpg exists, else
# preset theme mode. wallpaper.jpg is a TODO — drop your image at
# ~/.config/hypr/wallpaper.jpg. Without it, the session applies the
# selected preset (SUPER+SHIFT+T cycles; default `mocha` is seeded by
# 30-dotfiles.sh). `wal -i` always wins over presets. Both branches
# land ghostty's generated colors.conf via ghostty-theme.sh (the
# else branch runs the switcher, which calls the hook itself).
exec-once = if [ -f $HOME/.config/hypr/wallpaper.jpg ]; then wal -i $HOME/.config/hypr/wallpaper.jpg -q && $HOME/.config/ghostty/ghostty-theme.sh; else $HOME/.config/hypr/switch-theme.sh $(cat $HOME/.cache/wal/current-theme 2>/dev/null || echo mocha); fi

# Idle / lockscreen
exec-once = hypridle

# Polkit agent (one, not two) — prefer the GNOME one, fall back to KDE.
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &

# ---- Default MIME handlers --------------------------------------------------
# Helium is the default browser; VLC is the default video/audio player.
# Same xdg-mime pattern used for the Zed code-file handler below.
exec-once = xdg-mime default helium.desktop \
    x-scheme-handler/http \
    x-scheme-handler/https \
    x-scheme-handler/ftp \
    text/html \
    text/xml \
    application/xhtml+xml
exec-once = xdg-mime default vlc.desktop \
    video/x-msvideo \
    video/mp4 \
    video/x-matroska \
    video/webm \
    video/x-flv \
    video/quicktime \
    video/ogg \
    audio/mpeg \
    audio/flac \
    audio/ogg \
    audio/x-wav \
    audio/aac \
    application/ogg \
    application/x-ogg

# Zed as the default application for the configured code filetypes.
# Uses xdg-mime (xdg-utils, installed by 00-base.sh) to register a
# synthetic .desktop entry "zed-handler.desktop" against a matching
# MIME list. We write that .desktop file in 30-dotfiles.sh; here we
# just refresh the mime cache and run the associations so they take
# for the current session.
exec-once = update-desktop-database ~/.local/share/applications 2>/dev/null || true
exec-once = xdg-mime default zed-handler.desktop \
    text/x-python \
    application/x-csrc application/x-c++src application/x-chdr application/x-c++hdr \
    text/x-lua \
    text/x-java-source \
    text/x-rust \
    application/json application/x-json \
    text/x-toml \
    text/x-yaml application/x-yaml \
    text/markdown text/x-markdown \
    text/plain \
    application/x-shellscript
# Make Zed-style project roots (.git/.zed/workspaces) open with zed too:
exec-once = xdg-mime default zed-handler.desktop inode/directory 2>/dev/null || true

# eww demo widget (separate from waybar —Dates a small bar at top-right).
# Comment out if you don't want it.
exec-once = eww open bar_main || true

# ---- General ---------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    gaps_workspaces = 0
    border_size = 2
    col.active_border = rgb(eeeeee) rgb(89b4fa) 90deg
    col.inactive_border = rgb(45475a)
    layout = dwindle
    no_focus_fallback = true
    resize_on_border = true
}

# ---- Decoration ------------------------------------------------------------
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    drop_shadow = true
    shadow_range = 12
    shadow_render_power = 2
    col.shadow = rgba(00000055)
    # Slight translucency so the animated wallpaper reads through without
    # hurting text contrast (blur above keeps windows legible).
    active_opacity = 0.97
    inactive_opacity = 0.92
}

# ---- Animations ------------------------------------------------------------
animations {
    enabled = true
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn,  0.25, 1, 0.5, 1
    animation = windows, 1, 5, smoothOut, slide
    animation = windowsOut, 1, 5, smoothOut, slide
    animation = border, 1, 4, default
    animation = fade, 1, 5, smoothIn
    animation = workspaces, 1, 4, smoothOut, slide
}

# ---- Input ----------------------------------------------------------------
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
    }
    sensitivity = 0
}

# ---- Cursor ---------------------------------------------------------------
# Bibata Modern, 24px. Installed by 10-aur.sh.
env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME, Bibata-Modern-Classic
env = HYPRCURSOR_SIZE, 24

# ---- Environment -----------------------------------------------------------
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_QPA_PLATFORMTHEME, qt6ct
# Picks Qt's rendering backend (vs PLATFORMTHEME above, which picks the
# theme). `wayland;xcb` keeps an X11 fallback — without it, some Qt apps
# fail to start at all on Wayland.
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = SDL_VIDEODRIVER, wayland
env = CLUTTER_BACKEND, wayland
env = MOZ_ENABLE_WAYLAND, 1

# ---- GPU environment -----------------------------------------------------
# This rice supports both NVIDIA proprietary and Intel/AMD open drivers
# using the SAME config file. Default (no edits) = Intel/AMD mode.
#
# If you're on NVIDIA proprietary (nvidia package from pacman, kernel
# booted with `nvidia_drm.modeset=1 nvidia_drm.fbdev=1`):
#   * uncomment every `# NVIDIA:` line below
#   * source ~/.config/hypr/gpu-env.sh from your shell rc for app-level
#     env vars (see that file, or README "GPU-specific app env vars")
# Intel/AMD users: leave it all commented, this block is dead weight.
#
# NVIDIA:
# env = WLR_NO_HARDWARE_CURSORS, 1
# env = WLR_DRM_NO_ATOMIC, 1
# env = GBM_BACKEND, nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME, nvidia
# env = LIBVA_DRIVER_NAME, nvidia
# env = __GL_GSYNC_ALLOWED, 1
# env = __GL_VRR_ALLOWED, 1
# env = NVD_BACKEND, wayland
# env = NVD_GPU_ADAPTER, "NVIDIA-API/NVIDIA_API_RM_V1"
# opengl {
#     nvidia_anti_flicker = true
#     force_introspection = 1
# }

# ---- Key bindings ----------------------------------------------------------
# User-editable key and command variables are loaded immediately before
# these bindings from keybinds-extra.conf. Change that file instead of
# hunting through this list when customizing launch shortcuts.
source = ~/.config/hypr/keybinds-extra.conf

bind = $mod, Return, exec, $terminal
bind = $mod SHIFT, Return, exec, $menu
bind = $mod, B, exec, $browser
bind = $mod, V, exec, bitwarden
bind = $mod, E, exec, zed
bind = $mod SHIFT, E, exec, $files           # yazi (TUI)
bind = $mod SHIFT, F, exec, $gui_files        # thunar (GUI)
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, F, fullscreen,
bind = $mod, Space, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, T, togglesplit,

# Reload configs
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, $bar_reload

# Cycle preset themes (mocha -> gruvbox -> tokyonight -> osaka-jade)
# when no wallpaper is set; switch-theme.sh lives next to this file.
bind = $mod SHIFT, T, exec, ~/.config/hypr/switch-theme.sh cycle

# Play URL in VLC: rofi prompt, then vlc-open resolves before VLC starts
# (YouTube/etc via yt-dlp, Twitch via streamlink — see config/vlc/vlc-open;
# the pipe skips VLC entirely if you dismiss the prompt with Esc).
bind = $mod SHIFT, $key_url_player, exec, rofi -dmenu -p "play url" | xargs -r ~/.config/vlc/vlc-open

# Logout menu (wlogout).
bind = $mod SHIFT, $key_mail, exec, $terminal -e $mail_command
bind = $mod SHIFT, $key_calendar, exec, $terminal -e $calendar_command
bind = $mod SHIFT, $key_claude, exec, $terminal -e $claude_command
bind = $mod SHIFT, $key_deepseek, exec, $terminal -e $deepseek_command
bind = $mod SHIFT, $key_kilo, exec, $terminal -e $kilo_command
bind = $mod SHIFT, $key_logout, exec, wlogout

# Lock
bind = $mod SHIFT, $key_lock, exec, $lock

# Screenshot region -> cliphist (per keybind, not screenshot util)
bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && wl-paste | cliphist store

# Move focus
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# Move window
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# Resize via mod + arrows (held)
binde = $mod, left,  resizeactive, -20 0
binde = $mod, right, resizeactive,  20 0
binde = $mod, up,    resizeactive,  0 -20
binde = $mod, down,  resizeactive,  0  20

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Audio keys (if pipewire-pulse + wireplumber are running)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86MonBrightnessUp,   exec, brightnessctl s +5%
bindl  = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# ---- Window rules ----------------------------------------------------------
windowrule = float, ^(org.gnome.Calculator)$
windowrule = float, ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = center, ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float, ^(nm-connection-editor)$
windowrule = float, ^(wlogout)$
windowrule = float, ^(rofi)$
windowrule = float, ^(org.pulseaudio.pavucontrol)$
windowrule = float, ^(imv)$
windowrule = float, ^(mpv)$
windowrule = float, ^(color.picker)$

# Steam games + Steam itself
windowrule = workspace 5, ^(steam_app_\d+)$
windowrule = float, ^(steam_app_\d+)$

# Gamescope windows don't get focus decorations
windowrulev2 = nofocus, class:^(gamescope)$

# ---- Misc ----------------------------------------------------------------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_fallback = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ---- Sources ------------------------------------------------------------
# NOTE: hyprpaper and hypridle have their OWN config files and read them
# directly from their daemon startup (`hyprpaper` reads ~/.config/hypr/
# hyprpaper.conf by default; `hypridle` reads ~/.config/hypr/hypridle.conf).
# Sourcing those files INTO the compositor here is a bug — feeding
# `preload=`, `listener{} blocks`, etc. into Hyprland's parser as keywords
# it doesn't recognize, potentially clobbering the real `general {}` block
# above. Don't re-add them.
#
# Border colors from the rice palette: wal renders
# config/wal/templates/colors-hyprland.conf to ~/.cache/wal/ (preset
# switch copies the same filename), and because later assignments win,
# these override the baked rgb() values in `general {}` above. The file
# always exists by first boot — 30-dotfiles.sh seeds every format via
# the mocha preset. Hyprland reloads sourced files on change, so theme
# switches repaint borders without a relogin.
source = ~/.cache/wal/colors-hyprland.conf
