# wal template -> ~/.cache/wal/colors-hyprland.conf
# Sourced at the END of hyprland.conf (later assignment wins there), so
# these override the baked border colors in general{} without editing it.
# No `#` on the hex — Hyprland's col.* syntax takes bare rgb().
col.active_border = rgb(509475) rgb(FF5345) 90deg
col.inactive_border = rgb(23372B)
