# =============================================================================
# hyprpaper.conf  —  wallpaper daemon config.
#
# FALLBACK: hyprland.conf now starts mpvpaper (animated wallpaper) by
# default; this config only applies if you comment the mpvpaper exec-once
# and uncomment the hyprpaper exec-once in hyprland.conf.
#
# @@ TODO @@: replace wallpaper.jpg with your actual image.
# Place a copy of your wallpaper at ~/.config/hypr/wallpaper.jpg
# (the path used by hyprland.conf's `wal -i` line) and start there.
# Renaming here is also fine — but if you rename the path below, also
# rename the path in hyprland.conf's `wal -i` line so colors and
# wallpaper stay in sync.
# =============================================================================

# Syntax note: current hyprpaper (Arch ships 0.8.4) registers only
# splash/splash_offset/splash_opacity/ipc plus `wallpaper { ... }` blocks —
# the old `preload =` and flat `wallpaper = <monitor>, <path>` keywords are
# gone, and the daemon exits when its config fails to parse. `monitor = *`
# is the wildcard that applies this image to every connected output; 0.8.4
# prefers `*` over an empty monitor value (hyprlang lists empty
# special-category keys unreliably). One explicit block per monitor if
# displays need different images:
#
#     wallpaper {
#         monitor = DP-1
#         path = ~/.config/hypr/wallpaper.jpg
#     }
wallpaper {
    monitor = *
    path = ~/.config/hypr/wallpaper.jpg
}

# Allow hyprpaper to be stopped without locking the displayed wallpaper
ipc = on

# Splash off — handled by SDDM, doing both is redundant
splash = false
