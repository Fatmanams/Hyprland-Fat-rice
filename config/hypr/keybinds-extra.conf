# =============================================================================
# keybinds-extra.conf  —  user-local Hyprland keybind additions.
#
# This file is sourced by hyprland.conf immediately before its keybinds.
# Hyprland's `source` keyword cannot take shell redirection
# (`source = path 2>/dev/null || true` would error), so this file must
# always exist. 30-dotfiles.sh copies this maintained template so the
# rice's first run has both defaults and a safe customization point.
#
# Add your own keybinds here without touching the main hyprland.conf:
#   bind = SUPER SHIFT, T, exec, ghostty -e btop
#   bindl  = , XF86AudioNext, exec, playerctl next
#   bindel = SUPER, code:33, exec, brightnessctl s +10%
# etc. Hyprland picks up changes on `hyprctl reload`.
#
# QUICK CUSTOMIZATION
# Change a key below to move a shortcut, or change a command to match
# the executable installed on your system. Keep Hyprland key syntax.
# =============================================================================

# ---- User-editable launch assignments ---------------------------------------
$key_mail = N
$key_calendar = K
$key_claude = A
$key_deepseek = D
$key_kilo = I
$key_obs = O
$key_recorder = U
$key_logout = X
$key_lock = L
$key_url_player = M

$mail_command = neomutt
$calendar_command = ikhal
$claude_command = claude
$deepseek_command = deepseek-harness
$kilo_command = kilo
$obs_command = obs
$recorder_command = audacity
