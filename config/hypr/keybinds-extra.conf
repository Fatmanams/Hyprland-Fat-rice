# =============================================================================
# keybinds-extra.conf  —  user-local Hyprland keybind additions.
#
# This file is sourced by hyprland.conf immediately before its keybinds.
# Hyprland's `source` keyword cannot take shell redirection
# (`source = path 2>/dev/null || true` would error), so this file must
# always exist. 30-dotfiles.sh copies this maintained template so the
# rice's first run has both defaults and a safe customization point.
#
# Add your own keybinds here without touching the main hyprland.conf:
#   bind = SUPER SHIFT, T, exec, ghostty -e btop
#   bindl  = , XF86AudioNext, exec, playerctl next
#   bindel = SUPER, code:33, exec, brightnessctl s +10%
# etc. Hyprland picks up changes on `hyprctl reload`.
#
# QUICK CUSTOMIZATION
# Change a key below to move a shortcut, or change a command to match
# the executable installed on your system. Keep Hyprland key syntax.
# =============================================================================

# ---- User-editable launch assignments ---------------------------------------
# Letters must not reuse an existing SUPER+SHIFT binding (see the reference
# list in hyprland.conf) — that includes the case-insensitive movewindow
# block on h/j/k/l. Calendar uses G (Google Calendar): K collides with
# SUPER+SHIFT+k (movewindow u). The keybind menu uses slash (/): the only
# letters still free under SUPER+SHIFT are B, P, V, W, Y and Z, and those
# stay reserved for future app launches.
$key_mail = N
$key_calendar = G
$key_claude = A
$key_deepseek = D
$key_kilo = I
$key_obs = O
$key_recorder = U
$key_logout = X
$key_lock = L
$key_url_player = M
$key_lapce = G
$key_croft = C
$key_neovide = Z
$key_ox = R
$key_neomacs = Y
$key_binds = slash

$mail_command = neomutt
$calendar_command = ikhal
$claude_command = claude
$deepseek_command = deepseek-harness
$kilo_command = kilo
$obs_command = obs
$recorder_command = audacity
$lapce_command = lapce
$croft_command = ~/.config/croft/croft-launch.sh
$neovide_command = neovide
$ox_command = ~/.config/ox/ox-launch.sh
$neomacs_command = ~/.config/neomacs/neomacs-launch.sh

# ---- Extra binds ------------------------------------------------------------
# rofi keybind viewer/editor: lists every bind from this file and
# hyprland.conf, then opens the selected bind's file:line in zed --wait.
# binary is rebuilt from config/rofi/keybind-menu.cpp by 30-dotfiles.sh.
bind = $mod SHIFT, $key_binds, exec, ~/.config/rofi/keybind-menu
