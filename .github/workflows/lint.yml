name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The file lists live in scripts/lint.sh (the lint manifest); each
      # step below names its check, so a red build pinpoints the class.
      # Steps run strict: a tool vanishing from the runner is a red
      # build, never a silent skip.

      - name: bash -n syntax check
        run: bash scripts/lint.sh bash

      - name: shellcheck (error severity)
        run: bash scripts/lint.sh shellcheck

      - name: jq parse check (strip deliberate // headers first)
        run: bash scripts/lint.sh json

      - name: emacs lisp syntax check (byte-compile init.el + palette files)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq emacs-nox
          bash scripts/lint.sh emacs

      # Deeper than format presence: every preset's hexes must come from
      # its own colors.sh, switch-theme.sh's cp list must equal the
      # preset inventory, and every wal-template {placeholder} must be a
      # name pywal16 exports.
      - name: theme presets + wal templates (lint-themes.sh)
        run: bash scripts/lint.sh themes

      - name: nvim init.lua syntax (LuaJIT parse — nvim's dialect)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          bash scripts/lint.sh lua

      # g++ is preinstalled on ubuntu-latest; -fsyntax-only parses/semantics
      # without producing a binary (30-dotfiles.sh does the real -O2 build).
      # -Werror locks in the currently warning-free compile.
      - name: keybind-menu.cpp compiles clean (g++ -Werror)
        run: bash scripts/lint.sh cpp
